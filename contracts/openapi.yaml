    post:
      operationId: addMcName
      tags: [MC]
      summary: 提交一个 MC 用户名
      description: |
        **幂等**：首次创建返回 201；同一个名字（大小写不敏感）重复提交返回 200
        与已有条目，不会再次执行 RCON 写入。

        `name` 必须匹配 `^[A-Za-z0-9_]{3,16}$`，服务端归一为小写。
        `note` 必填，1–200 字符，不能含控制字符。

        写入必须被 `whitelist list` 回读确认；未被确认时返回 503 `rcon_unavailable`
        且**不落库**。
      security:
        - bearerAuth: []
      requestBody:
