openapi: 3.1.0
info:
  title: EliCloud Client API
  version: 1.0.0
  summary: EliCloud 客户端可见的 HTTP 契约（SSO / userinfo / MC / core）。
  description: |
    本文件是**唯一协议源**。四个平台客户端（Windows / macOS / Android / Linux）与
    各语言 SDK 只能依赖这里的端点、字段与错误码，不得私自新增。

    ## 范围

    - 只包含**客户端可见**端点。管理端点（`/auth/v1/clients*`、`/mc/v1/admin/*`）
      与内部回调（`/auth/internal/email/verification`）**不在**本契约内，绝不生成到客户端 SDK。
    - `servers` 里的地址只是**示意**：真实入口由各端在构建时注入、运行时只读，
      不得出现在 fixtures、示例或界面中。
    - 字段名与线上 JSON 完全一致（snake_case）。各端自己在传输层做命名映射，
      不要在契约里改写成 camelCase。

    ## 约定

    - 错误信封统一为 `EliCloudError`：`{"error": "...", "error_description": "..."}`；
      非 JSON 错误体只保留 HTTP 状态码。
    - `429` / `503` 可能带 `Retry-After`（秒数或 HTTP-date），客户端必须解析。
    - 错误码 → 用户文案的映射只在 `errors.json` + `copy/zh-CN.json` 维护。
    - 标记 `x-elicloud-status: planned` 的端点尚未上线，客户端可以按契约实现，
      但不得依赖其可用性。
  contact:
    name: EliCloud Contract Owner
    url: https://api.example.com
  license:
    name: Proprietary
x-contract-version: 1.0.0
x-contract-source: contracts/VERSION
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.example.com
    description: |
      示意入口（不代表任何真实部署）。真实入口由构建配置注入；客户端不得展示、
      记录或回退到任何默认地址。
tags:
  - name: Auth
    description: 账号中心（对外前缀 `/auth`）：注册、登录、刷新、UserInfo、OIDC。
  - name: UserInfo
    description: 个人资料（对外前缀 `/userinfo`）：昵称、简介、头像、头图。
  - name: MC
    description: MC 服务器白名单（对外前缀 `/mc`）。
  - name: Core
    description: 平台核心 API（对外前缀 `/core`）。**尚未上线**，仅作对接预留。
security: []
paths:
  # ============================================================ Auth / 注册
  /auth/register:
    post:
      operationId: registerStart
      tags: [Auth]
      summary: 发起注册（只发验证邮件，不创建账号）
      description: |
        成功后返回 202 与 `RegistrationPending`。调用方必须保存 `registration_id`
        并轮询 `/auth/register/status`；邮箱确认后账号才会创建。

        用户名只能是用户名（不能是邮箱），长度 3–32，`^[A-Za-z0-9][A-Za-z0-9_.-]*$`。
        密码 8–64 字符、UTF-8 不超过 72 字节、必须同时含字母与数字、不得是常见弱口令。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice
              password: S3cret!pass
              email: alice@example.com
      responses:
        '202':
          description: 已发出验证邮件，等待用户确认。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPending'
              example:
                registration_id: reg_examplepending
                status: pending
                email_masked: a***@example.com
                expires_at: '2026-11-01T20:00:00Z'
                resend_after: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/status:
    post:
      operationId: getRegistrationStatus
      tags: [Auth]
      summary: 查询待验证注册的状态
      description: |
        轮询接口。`status` 取值 `pending` / `verified` / `expired` / `failed`。
        只有 `verified` 会带 `user`；`expired` / `failed` 会带 `reason`。
        已取消的注册按不存在处理（404 `registration_not_found`）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRef'
            example:
              registration_id: reg_examplepending
      responses:
        '200':
          description: 当前状态快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatus'
              examples:
                pending:
                  value:
                    registration_id: reg_examplepending
                    status: pending
                    email_masked: a***@example.com
                    expires_at: '2026-11-01T20:00:00Z'
                    resend_after: 42
                verified:
                  value:
                    registration_id: reg_examplepending
                    status: verified
                    email_masked: a***@example.com
                    expires_at: '2026-11-01T20:00:00Z'
                    resend_after: 0
                    user:
                      id: u_example01
                      username: alice
                      email: alice@example.com
                      email_verified: true
                      created_at: '2026-11-01T19:41:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/resend:
    post:
      operationId: resendRegistrationEmail
      tags: [Auth]
      summary: 重发验证邮件
      description: |
        受冷却限制：`resend_after > 0` 时返回 429 并带 `Retry-After`。
        已验证的注册返回 409 `already_verified`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRef'
            example:
              registration_id: reg_examplepending
      responses:
        '202':
          description: 已重新发出验证邮件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPending'
              example:
                registration_id: reg_examplepending
                status: pending
                email_masked: a***@example.com
                expires_at: '2026-11-01T20:10:00Z'
                resend_after: 61
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register/cancel:
    post:
      operationId: cancelRegistration
      tags: [Auth]
      summary: 取消待验证注册
      description: |
        幂等：不存在或已取消都返回 204。已验证的账号返回 409 `already_verified`
        （账号已经存在，不能撤销）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRef'
            example:
              registration_id: reg_examplepending
      responses:
        '204':
          description: 已取消（或本来就不存在）。
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  # ============================================================== Auth / 登录
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 密码直连登录
      description: |
        `username` 字段收「登录标识」：用户名或邮箱都行。

        失败**不区分**账号不存在与密码错误（统一 401 `invalid_grant`）。
        密码正确但邮箱未验证是唯一例外：403 `email_not_verified`。

        登录成功后必须再调用 `/auth/userinfo`：`user` 只是便利字段，身份以 UserInfo 为准。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: S3cret!pass
      responses:
        '200':
          description: 令牌已签发。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMDEifQ.example.signature
                token_type: Bearer
                expires_in: 3600
                refresh_token: rt_example_refresh_token
                scope: openid profile email mc:whitelist userinfo:read userinfo:write
                user:
                  id: u_example01
                  username: alice
                  email: alice@example.com
                  email_verified: true
                  created_at: '2026-11-01T19:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 私有刷新（轮换 refresh token）
      description: |
        每次调用都会轮换 `refresh_token`，旧令牌立即失效。**重放旧令牌会被判为窃取，
        整条令牌链立刻全部撤销**，用户必须重新登录 —— 所以不要并发刷新。

        绑定了 `client_id` 的 OIDC 令牌不能在这里兑换，要走 `POST /auth/token`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: rt_example_refresh_token
      responses:
        '200':
          description: 已轮换。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMDEifQ.rotated.signature
                token_type: Bearer
                expires_in: 3600
                refresh_token: rt_example_rotated_token
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # =========================================================== Auth / UserInfo
  /auth/userinfo:
    get:
      operationId: getUserInfo
      tags: [Auth]
      summary: 读取当前用户身份（GET）
      description: |
        身份权威来源。claim 按 access token 的 `scope` 过滤：`sub` 恒有，
        `profile` scope 才有 `preferred_username`，`email` scope 才有 `email`。
        平台不再返回非标准的 `username` 字段。

        **不能**传 `id_token`（其 `aud` 是 client_id，会被 401 拒绝）。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 身份与令牌 scope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                sub: u_example01
                preferred_username: alice
                email: alice@example.com
                email_verified: true
                scope: openid profile email
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postUserInfo
      tags: [Auth]
      summary: 读取当前用户身份（POST，空 body）
      description: |
        OIDC 要求 GET 与 POST 两种都支持。代理对 GET 缓存不当时用 POST。
        语义与 `getUserInfo` 完全相同。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 身份与令牌 scope。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                sub: u_example01
                preferred_username: alice
                scope: openid profile
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/.well-known/openid-configuration:
    get:
      operationId: getOidcDiscovery
      tags: [Auth]
      summary: OIDC 发现文档（匿名）
      description: |
        核对「目标地址到底是什么形态」最可靠的依据：`issuer` 必须与实际对外地址逐字一致。
        SDK 默认不依赖它拼端点，但它是运维自检手段。
      security: []
      responses:
        '200':
          description: 发现文档。
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcDiscoveryDocument'
              example:
                issuer: https://api.example.com/auth
                authorization_endpoint: https://api.example.com/auth/authorize
                token_endpoint: https://api.example.com/auth/token
                userinfo_endpoint: https://api.example.com/auth/userinfo
                jwks_uri: https://api.example.com/auth/.well-known/jwks.json
                device_authorization_endpoint: https://api.example.com/auth/device_authorization
                end_session_endpoint: https://api.example.com/auth/logout
                response_types_supported: [code]
                response_modes_supported: [query]
                grant_types_supported:
                  - authorization_code
                  - refresh_token
                  - urn:ietf:params:oauth:grant-type:device_code
                code_challenge_methods_supported: [S256]
                token_endpoint_auth_methods_supported: [none, client_secret_basic, client_secret_post]
                id_token_signing_alg_values_supported: [RS256]
                subject_types_supported: [public]
                scopes_supported:
                  - openid
                  - profile
                  - email
                  - offline_access
                  - mc:whitelist
                  - files:read
                  - files:write
                  - userinfo:read
                  - userinfo:write
                claims_supported: [sub, preferred_username, email, email_verified]
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Auth]
      summary: 公钥集（匿名）
      description: 业务服务验签 access token / id_token 用；客户端缓存 5 分钟。
      security: []
      responses:
        '200':
          description: JWKS。
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksDocument'
              example:
                keys:
                  - kty: RSA
                    kid: '2026-01'
                    use: sig
                    alg: RS256
                    n: sXchDAexample0example1example2
                    e: AQAB
        '500':
          $ref: '#/components/responses/InternalError'
  # ============================================================ Auth / OIDC（未来）
  /auth/authorize:
    get:
      operationId: authorize
      tags: [Auth]
      summary: 授权码 + PKCE 授权端点（浏览器跳转）
      description: |
        **浏览器跳转语义**，不是 Bearer 调用：成功 302 回跳 `redirect_uri?code=...&state=...`。
        公开客户端必须带 `code_challenge`（`S256`，`plain` 被显式拒绝）。

        前提：客户端已在 SSO 静态注册，`redirect_uri` 必须与注册值逐字一致。
        `prompt=none` 且无会话时回跳 `error=login_required`。
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: openid profile email
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: nonce
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            const: S256
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            enum: [login, none]
      responses:
        '302':
          description: 回跳客户端（带 `code` 或 `error`）。
          headers:
            Location:
              schema:
                type: string
                example: https://desktop.example.com/callback?code=ac_example&state=st_example
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: 请求不合法（渲染登录页/错误页，不是 JSON 信封）。
          content:
            text/html:
              schema:
                type: string
              example: <!doctype html><title>EliCloud</title><p>请求不合法</p>
  /auth/token:
    post:
      operationId: token
      tags: [Auth]
      summary: 令牌端点（授权码 / 刷新 / 设备码）
      description: |
        `application/x-www-form-urlencoded`。客户端认证三选一且不混用：
        `client_id`（公开客户端）、`client_secret_basic`、`client_secret_post`；
        同一次请求既用 Basic 又带表单 secret 会被判 `invalid_request`。

        - `grant_type=authorization_code`：换令牌（校验 code 归属、redirect_uri 逐字一致、PKCE）。
        - `grant_type=refresh_token`：**强制客户端绑定**，scope 只能收窄不能扩大。
        - `grant_type=urn:ietf:params:oauth:grant-type:device_code`：轮询设备码。

        设备码轮询的 `authorization_pending` / `slow_down` 是**正常轮询状态**，
        不应让客户端报错，而应继续按 `interval` 轮询。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              authorizationCode:
                value:
                  grant_type: authorization_code
                  code: ac_example
                  redirect_uri: https://desktop.example.com/callback
                  code_verifier: verifier_example_43_chars_minimum_length_0000000
                  client_id: elicloud-desktop
              deviceCode:
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  device_code: dc_example
                  client_id: elicloud-desktop
      responses:
        '200':
          description: 令牌已签发。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMDEifQ.example.signature
                token_type: Bearer
                expires_in: 3600
                scope: openid profile email mc:whitelist
                id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjIwMjYtMDEifQ.example.idtoken
                refresh_token: rt_example_offline_access
        '400':
          $ref: '#/components/responses/TokenError'
        '401':
          $ref: '#/components/responses/TokenError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/device_authorization:
    post:
      operationId: deviceAuthorization
      tags: [Auth]
      summary: 设备授权（RFC 8628 第一步）
      description: |
        `application/x-www-form-urlencoded`。返回设备码与人读短码；
        把 `verification_uri_complete` 显示给用户，然后按 `interval` 轮询 `/auth/token`。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
            example:
              client_id: elicloud-cli
              scope: openid profile email
      responses:
        '200':
          description: 设备码。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
              example:
                device_code: dc_example_device_code
                user_code: WDJB-MJHT
                verification_uri: https://api.example.com/auth/device
                verification_uri_complete: https://api.example.com/auth/device?user_code=WDJB-MJHT
                expires_in: 600
                interval: 5
        '400':
          $ref: '#/components/responses/TokenError'
        '401':
          $ref: '#/components/responses/TokenError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    get:
      operationId: logout
      tags: [Auth]
      summary: RP-Initiated Logout（浏览器跳转）
      description: |
        **浏览器跳转语义**：清会话 cookie、撤销该会话派生的 refresh 链。

        `post_logout_redirect_uri` 必须在该客户端注册的 `post_logout_redirect_uris` 内，
        否则服务端**不会跳转**（防开放重定向），而是渲染登出页。
        `id_token_hint` 只校验签名与 `iss`（允许已过期）。
      security: []
      parameters:
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 已登出并回跳。
          headers:
            Location:
              schema:
                type: string
                example: https://desktop.example.com/signed-out
            Set-Cookie:
              schema:
                type: string
                example: elicloud_session=; Max-Age=0; Path=/
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '200':
          description: 已登出，但未提供/未注册回跳地址（渲染登出页）。
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
              example: <!doctype html><title>已退出</title><p>你已退出登录。</p>
  # ============================================================== UserInfo
  /userinfo/v1/profile:
    get:
      operationId: getMyProfile
      tags: [UserInfo]
      summary: 读取自己的资料
      description: |
        **没有记录也返回 200**：`nickname` / `bio` / 图片字段为 `null`。
        客户端在这种情况下用 SSO 用户名兜底展示。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 资料快照（可能全为 null 字段）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                user_id: u_example01
                nickname: 秋风
                bio: 白天写代码，晚上挖矿。
                avatar:
                  content_type: image/png
                  size_bytes: 20480
                  sha256: 9f2c1b7d0e4a5c6b8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e
                  updated_at: '2026-11-01T19:30:00Z'
                banner: null
                created_at: '2026-10-30T08:00:00Z'
                updated_at: '2026-11-01T19:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateMyProfile
      tags: [UserInfo]
      summary: 全量保存昵称与简介
      description: |
        全量保存（不是 PATCH）。未知字段会被拒绝（400 `invalid_request`）。

        - 昵称：trim + NFC，1–32 个码点，不能含控制字符与换行。
        - 简介：≤500 字符，纯文本；空字符串等价于清空（返回 `null`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            example:
              nickname: 秋风
              bio: 白天写代码，晚上挖矿。
      responses:
        '200':
          description: 保存后的资料快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                user_id: u_example01
                nickname: 秋风
                bio: 白天写代码，晚上挖矿。
                avatar: null
                banner: null
                created_at: '2026-10-30T08:00:00Z'
                updated_at: '2026-11-01T19:35:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /userinfo/v1/profiles/{sub}:
    get:
