  /userinfo/v1/profile/{kind}:
    parameters:
      - $ref: '#/components/parameters/ProfileKind'
    get:
      operationId: getMyProfileImage
      tags: [UserInfo]
      summary: 读取自己的头像 / 头图（二进制）
      description: |
        返回图片字节与 `ETag`（值为 sha256，带引号）。客户端带 `If-None-Match`
        且命中时返回 304（无 body）。客户端按 sha256 缓存位图，不落盘图片字节。
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            example: '"9f2c1b7d0e4a5c6b8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e"'
      responses:
        '200':
          description: 图片字节。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
              x-example-fixture: fixtures/userinfo/image-avatar.png
            image/jpeg:
              schema:
                type: string
                format: binary
              x-example-fixture: fixtures/userinfo/image-banner.jpg
            image/webp:
              schema:
                type: string
                format: binary
              x-example-fixture: fixtures/userinfo/image-avatar.png
        '304':
          description: 命中 `If-None-Match`，body 为空。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: uploadMyProfileImage
      tags: [UserInfo]
      summary: 上传并替换头像 / 头图（multipart）
      description: |
        `multipart/form-data`，字段名固定 `file`。

        服务端先按声明的 `Content-Type` 白名单校验，再按文件头嗅探真实类型，
        两者必须一致（防止改扩展名）。成功后返回完整资料快照。

        客户端在上传前完成裁切与重编码：头像缩到 512px、头图 1600px 内，banner 5:1。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG / JPEG / WebP 图片字节。
            encoding:
              file:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '200':
          description: 替换成功后的资料快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                user_id: u_example01
                nickname: 秋风
                bio: null
                avatar:
                  content_type: image/png
                  size_bytes: 20480
                  sha256: 9f2c1b7d0e4a5c6b8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e
                  updated_at: '2026-11-01T19:40:00Z'
                banner: null
                created_at: '2026-10-30T08:00:00Z'
                updated_at: '2026-11-01T19:40:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteMyProfileImage
      tags: [UserInfo]
      summary: 删除头像 / 头图
      description: '幂等：本来就没有图片时返回 200 且 `changed: false`。'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 删除结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteImageResponse'
              example:
                deleted: true
                changed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
