  # ================================================================== MC
  /mc/healthz:
    get:
      operationId: mcHealth
      tags: [MC]
      summary: MC 服务健康快照（匿名）
      description: |
        RCON 不可达时返回 **503 但仍带完整 body** —— 这不是错误响应，
        客户端必须照常解析，由 `rcon.reachable` 判断可用性。
        只有 200/503 之外的状态码才按错误处理。

        `rcon.endpoint` 是运维字段，**不展示给用户**。
      security: []
      responses:
        '200':
          description: 健康。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McHealthStatus'
              example:
                status: ok
                rcon:
                  reachable: true
                  endpoint: mc.example.com:25575
                  latency_ms: 3
                whitelist_count: 7
                sso_issuer: https://api.example.com/auth
                version: 1.0.0
        '503':
          description: 降级（RCON 不可达），body 仍是完整健康快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McHealthStatus'
              example:
                status: degraded
                rcon:
                  reachable: false
                  endpoint: mc.example.com:25575
                  error: connection refused
                whitelist_count: null
                sso_issuer: https://api.example.com/auth
                version: 1.0.0
        '500':
          $ref: '#/components/responses/InternalError'
