components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        SSO 签发的 RS256 access token。**不能**用 `id_token`（其 `aud` 是 client_id，
        业务服务会按 `aud` 拒绝）。
  parameters:
    ProfileKind:
      name: kind
      in: path
      required: true
      description: 图片种类。
      schema:
        type: string
        enum: [avatar, banner]
  headers:
    NoStore:
      description: 令牌响应一律不得缓存。
      schema:
        type: string
        example: no-store
    ETag:
      description: 图片内容的 sha256（带双引号）。
      schema:
        type: string
        example: '"9f2c1b7d0e4a5c6b8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e"'
    RetryAfter:
      description: 建议等待时长；秒数或 HTTP-date。
      schema:
        type: string
        examples: ['60', 'Wed, 21 Oct 2026 07:28:00 GMT']
    WWWAuthenticate:
      description: 认证挑战（`invalid_token` / `insufficient_scope`）。
      schema:
        type: string
        example: 'Bearer error="insufficient_scope", scope="mc:whitelist"'
  responses:
    BadRequest:
      description: 请求不合法（`invalid_request` 或字段级校验码）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: invalid_request
            error_description: 请求参数不合法
    Unauthorized:
      description: 令牌缺失/过期/签名错/iss 或 aud 不符（`invalid_token`），或凭证错误（`invalid_grant`）。
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          examples:
            invalidToken:
              value:
                error: invalid_token
                error_description: 令牌已过期
            invalidGrant:
              value:
                error: invalid_grant
                error_description: 账号或密码错误
    TokenError:
      description: OAuth 令牌端点的 RFC 6749 §5.2 错误（`invalid_request` / `invalid_client` / `invalid_grant` / ...）。
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          examples:
            invalidClient:
              value:
                error: invalid_client
                error_description: 客户端认证失败
            authorizationPending:
              value:
                error: authorization_pending
                error_description: 用户尚未确认
            slowDown:
              value:
                error: slow_down
                error_description: 轮询过快
    Forbidden:
      description: 身份有效但权限不足（`insufficient_scope`），或业务规则拒绝（`email_not_verified` / `registration_disabled`）。
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          examples:
            insufficientScope:
              value:
                error: insufficient_scope
                error_description: 这次登录没有拿到文件服务的权限
            emailNotVerified:
              value:
                error: email_not_verified
                error_description: 邮箱还没有验证，请先完成邮箱验证
    NotFound:
      description: 资源不存在，**或存在但不属于当前用户**（服务端刻意不区分）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          examples:
            notFound:
              value:
                error: not_found
                error_description: 条目不存在
            profileNotFound:
              value:
                error: profile_not_found
                error_description: 还没有这个用户的资料
            imageNotFound:
              value:
                error: image_not_found
                error_description: 还没有设置这张图片
    Conflict:
      description: 状态冲突（`user_exists` / `email_exists` / `registration_pending` / `already_verified` / `name_taken` / `quota_exceeded`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          examples:
            userExists:
              value:
                error: user_exists
                error_description: 该用户名已被占用
            nameTaken:
              value:
                error: name_taken
                error_description: 用户名 alice_star 已被其它账号绑定
            quotaExceeded:
              value:
                error: quota_exceeded
                error_description: 每个账号最多绑定 2 个 MC 用户名，请先撤回一个
    Gone:
      description: 资源已过期（`registration_expired`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: registration_expired
            error_description: 这次注册已经过期，请重新创建账号
    PayloadTooLarge:
      description: 图片超过大小上限（`image_too_large`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: image_too_large
            error_description: 图片超过上限 5 MiB
    TooManyRequests:
      description: 触发限流（`rate_limited` / `too_many_requests`）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: too_many_requests
            error_description: 登录尝试过于频繁，请稍后再试
    BadGateway:
      description: 依赖服务返回意外结果（`email_delivery_failed` / `file_service_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: email_delivery_failed
            error_description: 验证邮件发送失败，请稍后重试
    ServiceUnavailable:
      description: |
        依赖不可用（`email_service_unavailable` / `file_service_unavailable` /
        `database_unavailable` / `rcon_unavailable` / `jwks_unavailable`）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: rcon_unavailable
            error_description: 白名单写入未被回读确认，本次未记录
    InternalError:
      description: 服务端内部错误（`server_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EliCloudError'
          example:
            error: server_error
            error_description: 服务内部错误
  schemas:
    # ------------------------------------------------------------- 通用
    EliCloudError:
      type: object
      description: 所有服务的统一错误信封。
      required: [error]
      properties:
        error:
          type: string
          description: 错误码；调用方必须按它分支，不要按 `error_description` 文案分支。
          example: invalid_grant
        error_description:
          type: [string, 'null']
          description: 人类可读说明；随时可能改，不可用于逻辑判断。
          example: 账号或密码错误
    # --------------------------------------------------------------- 认证
    RegisterRequest:
      type: object
      required: [username, password, email]
      additionalProperties: true
      properties:
        username:
          type: string
          description: 只能填用户名（不能含 `@`），3–32 字符，`^[A-Za-z0-9][A-Za-z0-9_.-]*$`。
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          example: alice
        password:
          type: string
          format: password
          description: 8–64 字符；UTF-8 不超过 72 字节；必须同时含字母与数字；不得是常见弱口令。
          minLength: 8
          maxLength: 64
        email:
          type: string
          format: email
          description: 注册必须填写邮箱，服务端会向它发送验证邮件。
          maxLength: 254
          example: alice@example.com
    RegistrationRef:
      type: object
      required: [registration_id]
      properties:
        registration_id:
          type: string
          description: |
            注册 capability（形如 `reg_...`）。用来查询状态/重发/取消，
            **不要**当作用户 ID 存库。
          minLength: 1
          maxLength: 128
          example: reg_examplepending
    RegistrationPending:
      type: object
      required: [registration_id, status, email_masked, expires_at, resend_after]
      properties:
        registration_id:
          type: string
          example: reg_examplepending
        status:
          $ref: '#/components/schemas/RegistrationStatusValue'
        email_masked:
          type: string
          description: 掩码邮箱，如 `a***@example.com`。
          example: a***@example.com
        expires_at:
          type: string
          format: date-time
          description: 验证链接过期时间（ISO8601 UTC）。
          example: '2026-11-01T20:00:00Z'
        resend_after:
          type: integer
          minimum: 0
          description: 距离可以重发验证邮件的秒数；0 表示可立即重发。
          example: 60
    RegistrationStatus:
      type: object
      required: [registration_id, status, email_masked, expires_at, resend_after]
      properties:
        registration_id:
          type: string
          example: reg_examplepending
        status:
          $ref: '#/components/schemas/RegistrationStatusValue'
        email_masked:
          type: string
          example: a***@example.com
        expires_at:
          type: string
          format: date-time
          example: '2026-11-01T20:00:00Z'
        resend_after:
          type: integer
          minimum: 0
          example: 42
        user:
          description: 仅在 `verified` 时返回。
          oneOf:
            - $ref: '#/components/schemas/EliCloudUser'
            - type: 'null'
        reason:
          type: [string, 'null']
          description: |
            `expired` / `failed` 时的原因，如 `timeout`、`username_taken`、
            `email_taken`、`email_delivery_failed`、`email_service_unavailable`。
          example: timeout
    RegistrationStatusValue:
      type: string
      description: |
        `pending` 等待确认；`verified` 账号已创建；`expired` 链接过期；
        `failed` 建号失败。已取消的注册按不存在处理（404），不会出现在这里。
      enum: [pending, verified, expired, failed]
    EliCloudUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          description: 用户 ID，即 JWT 的 `sub`；永不变更。
          example: u_example01
        username:
          type: string
          example: alice
        email:
          type: [string, 'null']
          format: email
          example: alice@example.com
        email_verified:
          type: [boolean, 'null']
          description: 历史账号/管理员建号可能为 `false`。
          example: true
        created_at:
          type: [string, 'null']
          format: date-time
          example: '2026-11-01T19:00:00Z'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 登录标识：用户名或邮箱都行（字段名沿用 `username`）。
          example: alice
        password:
          type: string
          format: password
          example: S3cret!pass
    LoginResult:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token:
          type: string
          description: RS256 JWT，`aud` 为业务服务受众。
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: access token 有效期（秒）。
          example: 3600
        refresh_token:
          type: string
          example: rt_example_refresh_token
        scope:
          type: string
          description: 空格分隔的 scope。
          example: openid profile email mc:whitelist
        user:
          description: 便利字段；身份以 `/auth/userinfo` 为准。
          oneOf:
            - $ref: '#/components/schemas/EliCloudUser'
            - type: 'null'
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: rt_example_refresh_token
    RefreshResult:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          description: 轮换后的新令牌；旧令牌立即失效。
          example: rt_example_rotated_token
    UserInfoResponse:
      type: object
      required: [sub]
      properties:
        sub:
          type: string
          example: u_example01
        preferred_username:
          type: [string, 'null']
          description: 需要 `profile` scope。平台**不再**返回非标准的 `username`。
          example: alice
        email:
          type: [string, 'null']
          description: 需要 `email` scope，且账号确实填了邮箱。
          example: alice@example.com
        email_verified:
          type: [boolean, 'null']
          example: true
        name:
          type: [string, 'null']
          description: 平台当前不返回，保留以兼容未来。
        scope:
          type: [string, 'null']
          description: 本次令牌的 scope（不是用户 claim，保留以便自检）。
          example: openid profile email
    OidcDiscoveryDocument:
      type: object
      required: [issuer]
      properties:
        issuer:
          type: string
          description: 必须与运行时实际对外地址逐字一致（JWT 的 `iss` 也是它）。
          example: https://api.example.com/auth
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
          description: |
            ⚠️ 线缆名是一个词 `userinfo_endpoint`；按通用命名策略猜成
            `user_info_endpoint` 会静默绑定成 null。
        jwks_uri:
          type: string
          format: uri
        device_authorization_endpoint:
          type: string
          format: uri
        end_session_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
            enum: [S256]
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [RS256]
        subject_types_supported:
          type: array
          items:
            type: string
            enum: [public]
        scopes_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
    JwksDocument:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      type: object
      required: [kty, kid]
      properties:
        kty:
          type: string
          example: RSA
        kid:
          type: string
          example: '2026-01'
        use:
          type: string
          example: sig
        alg:
          type: string
          example: RS256
        n:
          type: string
          description: RSA modulus（base64url）。
        e:
          type: string
          description: RSA exponent（base64url）。
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
        code:
          type: string
          description: '`authorization_code` 时必填。'
        redirect_uri:
          type: string
          format: uri
          description: '`authorization_code` 时必填，必须与授权请求逐字相同。'
        code_verifier:
          type: string
          description: PKCE verifier（43–128 字符）。
          minLength: 43
          maxLength: 128
        refresh_token:
          type: string
          description: '`refresh_token` 时必填。'
        device_code:
          type: string
          description: 设备码轮询时必填。
        client_id:
          type: string
          description: 公开客户端必填；保密客户端可用 Basic 认证代替。
        client_secret:
          type: string
          format: password
          description: '`client_secret_post` 时使用；不得与 Basic 混用。'
        scope:
          type: string
          description: '`refresh_token` 时可收窄 scope（不能扩大）。'
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: [string, 'null']
          example: openid profile email mc:whitelist
        id_token:
          type: [string, 'null']
          description: '`aud` 是 client_id，**不可用于访问业务 API**。'
        refresh_token:
          type: [string, 'null']
          description: 只有请求了 `offline_access` 才会出现。
    DeviceAuthorizationRequest:
      type: object
      required: [client_id, scope]
      properties:
        client_id:
          type: string
          example: elicloud-cli
        client_secret:
          type: string
          format: password
        scope:
          type: string
          example: openid profile email
    DeviceAuthorizationResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
          description: 只给设备，用于轮询令牌端点。
        user_code:
          type: string
          description: 人读短码（去掉易混淆字符），形如 `WDJB-MJHT`。
          example: WDJB-MJHT
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: [string, 'null']
          format: uri
        expires_in:
          type: integer
          example: 600
        interval:
          type: integer
          description: 轮询间隔（秒）；`slow_down` 时 +5，上限 60。
          example: 5
    # ------------------------------------------------------------- UserInfo
    ProfileUpdateRequest:
      type: object
      required: [nickname]
      additionalProperties: false
      properties:
        nickname:
          type: string
          description: trim + NFC 后 1–32 个码点；不能是空串、不能含控制/格式字符、不能换行。
          minLength: 1
          maxLength: 32
          example: 秋风
        bio:
          type: [string, 'null']
          description: 纯文本，≤500 字符；空串等价于清空。
          maxLength: 500
          example: 白天写代码，晚上挖矿。
    ProfileImageInfo:
      type: object
      required: [content_type, size_bytes, sha256, updated_at]
      properties:
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        size_bytes:
          type: integer
          minimum: 0
          example: 20480
        sha256:
          type: string
          description: 图片内容的 sha256（小写 hex），同时用作缓存键与 ETag。
          pattern: '^[0-9a-f]{64}$'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-01T19:30:00Z'
    UserProfile:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: SSO 的 `sub`。
          example: u_example01
        nickname:
          type: [string, 'null']
          example: 秋风
        bio:
          type: [string, 'null']
          example: 白天写代码，晚上挖矿。
        avatar:
          description: 头像元数据；没有设置时为 null。
          oneOf:
            - $ref: '#/components/schemas/ProfileImageInfo'
            - type: 'null'
        banner:
          description: 头图元数据；没有设置时为 null。
          oneOf:
            - $ref: '#/components/schemas/ProfileImageInfo'
            - type: 'null'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    DeleteImageResponse:
      type: object
      required: [deleted, changed]
      properties:
        deleted:
          type: boolean
          const: true
        changed:
          type: boolean
          description: 是否真的删掉了东西；本来就是空的为 `false`。
    # ------------------------------------------------------------------ MC
    McHealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        rcon:
          description: RCON 连通性。
          oneOf:
            - $ref: '#/components/schemas/McRconStatus'
            - type: 'null'
        whitelist_count:
          type: [integer, 'null']
          description: 白名单里的名字数量；RCON 不可达时为 null。
          example: 7
        sso_issuer:
          type: [string, 'null']
          description: 本服务配置的 SSO issuer，用于核对与平台是否一致。
          example: https://api.example.com/auth
        version:
          type: [string, 'null']
          example: 1.0.0
    McRconStatus:
      type: object
      required: [reachable]
      properties:
        reachable:
          type: boolean
        endpoint:
          type: [string, 'null']
          description: |
            `host:port`。**运维字段，不展示给用户** —— 错误文案也不能出现它。
          example: mc.example.com:25575
        latency_ms:
          type: [integer, 'null']
          description: 一次 `whitelist list` 的往返毫秒数。
          example: 3
        error:
          type: [string, 'null']
          description: 不可达原因（技术文本，不展示给用户）。
    McNameQuota:
      type: object
      required: [limit, used, remaining]
      properties:
        limit:
          type: integer
          example: 2
        used:
          type: integer
          example: 1
        remaining:
          type: integer
          example: 1
    McNameEntry:
      type: object
      required: [id, name, name_display, note, status]
      properties:
        id:
          type: string
          example: mn_0001
        name:
          type: string
          description: 归一后的 MC 用户名（小写），服务内部一律用它做键。
          example: alice_star
        name_display:
          type: string
          description: 用户提交时的原始写法，仅用于展示。
          example: Alice_Star
        note:
          type: string
          description: 必填备注，1–200 字符。
          example: 主账号
        status:
          type: string
          enum: [active, removed]
        uuid:
          type: [string, 'null']
          description: |
            恒为 null：服务只走 RCON，`whitelist list` 不返回 UUID，
            平台刻意不自己构造。**不要**把它当判定依据。
        created_at:
          type: [string, 'null']
          format: date-time
        removed_at:
          type: [string, 'null']
          format: date-time
    McNameListResponse:
      type: object
      required: [sub, names]
      properties:
        sub:
          type: string
          example: u_example01
        quota:
          oneOf:
            - $ref: '#/components/schemas/McNameQuota'
            - type: 'null'
        names:
          type: array
          items:
            $ref: '#/components/schemas/McNameEntry'
    CreateNameRequest:
      type: object
      required: [name, note]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9_]{3,16}$'
          description: MC 用户名；服务端归一为小写。
          example: Alice_Star
        note:
          type: string
          minLength: 1
          maxLength: 200
          description: 必填备注，1–200 字符，不能含控制字符。
          example: 主账号
    McIdentity:
      type: object
      required: [sub]
      properties:
        sub:
          type: string
          example: u_example01
        username:
          type: [string, 'null']
          description: 来自令牌 claim，不查 SSO 数据库。
        issuer:
          type: [string, 'null']
        scope:
          type: [string, 'null']
    # ---------------------------------------------------------------- Core
    CoreServiceListResponse:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/CoreServiceInfo'
    CoreServiceInfo:
      type: object
      required: [id, name, path, online]
      properties:
        id:
          type: string
          description: 服务名（容器名），如 `mc`。
          example: mc
        name:
          type: string
          example: MC 白名单
        path:
          type: string
          description: 对外路径前缀，如 `/mc`。**不是**服务名。
          example: /mc
        online:
          type: boolean
          example: true
