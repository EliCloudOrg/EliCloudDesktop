          description: 新建成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McNameEntry'
              example:
                id: mn_0001
                name: alice_star
                name_display: Alice_Star
                note: 主账号
                status: active
                uuid: null
                created_at: '2026-11-01T10:00:00Z'
