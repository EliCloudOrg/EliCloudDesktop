name: shared (design tokens / copy / assets / audit)

on:
  pull_request:
    paths:
      - "design/**"
      - "tools/**"
      - "contracts/copy/**"
      - "clients/windows/hello/**"
      - "clients/macos/**"
      - "clients/android/**"
      - "clients/linux/**"
      - ".github/workflows/shared.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  generators:
    name: 生成器测试 + 生成物 diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"

      - name: Install pinned Python deps
        run: python -m pip install --disable-pip-version-check pillow==11.1.0

      - name: gen-tokens tests (snapshot + failure cases)
        run: python -m unittest discover -s tools/gen-tokens/tests -v

      - name: gen-copy tests (snapshot + coverage + failure cases)
        run: python -m unittest discover -s tools/gen-copy/tests -v

      - name: gen-build-config tests (invalid values fail the build)
        run: python -m unittest discover -s tools/gen-build-config/tests -v

      - name: audit-official-styles tests
        run: python -m unittest discover -s tools/audit-official-styles/tests -v

      - name: Tokens / copy outputs are up to date
        run: |
          python tools/gen-tokens/gen_tokens.py --check
          python tools/gen-copy/gen_copy.py --check

      - name: Assets manifest is valid
        run: python tools/export-assets.py --check

      - name: Official-style audit (all platforms)
        run: python tools/audit-official-styles/audit.py --report artifacts/audit.md

      - name: Invalid build config must fail the build
        run: |
          set -e
          if python tools/gen-build-config/gen_build_config.py \
              --environment prod --platform windows --check \
              --base-url http://insecure.example.com; then
            echo "expected build config validation to fail" >&2
            exit 1
          fi

      - name: Generated artifacts must not drift
        run: |
          git status --porcelain
          git diff --exit-code

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-style-audit
          path: artifacts/audit.md
          if-no-files-found: ignore
